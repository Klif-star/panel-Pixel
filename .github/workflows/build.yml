name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Tulis proyek Pixel Panel
        run: |
          mkdir -p app/src/main/java/com/pixelpanel app/src/main/res/xml app/src/main/res/values
          cat > settings.gradle.kts <<'PP_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PixelPanel"
          include(":app")
          PP_EOF
          cat > build.gradle.kts <<'PP_EOF'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          PP_EOF
          cat > gradle.properties <<'PP_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          PP_EOF
          cat > app/build.gradle.kts <<'PP_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.pixelpanel"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.pixelpanel"
                  minSdk = 24
                  targetSdk = 33
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          PP_EOF
          cat > app/src/main/AndroidManifest.xml <<'PP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:label="Pixel Panel"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".PickActivity"
                      android:excludeFromRecents="true"
                      android:exported="false"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar" />

                  <service
                      android:name=".OverlayService"
                      android:exported="false" />

                  <service
                      android:name=".TapService"
                      android:exported="false"
                      android:label="Pixel Panel Auto Shoot"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          PP_EOF
          cat > app/src/main/res/xml/accessibility_config.xml <<'PP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
