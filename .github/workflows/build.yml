          cat > app/src/main/java/com/pixelpanel/Prefs.kt <<'PP_EOF'
          package com.pixelpanel

          import android.content.Context

          object Prefs {
              private fun sp(c: Context) = c.getSharedPreferences("pp", Context.MODE_PRIVATE)

              fun bool(c: Context, k: String, d: Boolean): Boolean = sp(c).getBoolean(k, d)

              fun int(c: Context, k: String, d: Int): Int = sp(c).getInt(k, d)

              fun put(c: Context, k: String, v: Boolean) {
                  sp(c).edit().putBoolean(k, v).apply()
